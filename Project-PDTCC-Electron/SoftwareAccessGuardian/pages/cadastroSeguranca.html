<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/styleCadastroSeguranca.css">
</head>

<body>

    <main class="tela">
        <a href="inicio.html">
            <img src="../images/logos/logo_fundo_azul.png" alt="Logo" class="logo-header">
        </a>
        <!--
            Botao de configuracoes da pagina
        -->
        <button class="settings-main" aria-label="Configurações" id="btnConfig">

            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none"
                stroke="#E1E1E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-settings-icon lucide-settings">
                <path
                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
            </svg>

        </button>

        <div class="campoConfig">

            <button id="btnFecharMenu" class="btnFecharMenu" aria-label="Fechar menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <ul class="itensConfig">
                <li class="itemTextConfig">Configurações</li>
                <li class="itemTextModoIluminacao">
                    <p class="textModoIluminacao">Modo de Iluminação</p>
                </li>
                <li class="itemModoIluminacao">
                    <select name="" id="">
                        <option value="claro">Claro</option>
                        <option value="escuro">Escuro</option>
                    </select>
                </li>
                <li class="itemTextAcessibilidaDe">
                    <p class="textAcessibilidade">Acessibilidadade</p>
                </li>
                <li class="itemConfig1">Config1</li>
                <li class="itemConfig2">Config2</li>
                <li class="itemConfig3">Config3</li>
                <li class="itemConfig4">Config4</li>
            </ul>
        </div>


        <section class="cadastro">
            <h1>Cadastro</h1>

            <form id="formCadastro">
                <div class="campo">
                    <input type="email" id="email" placeholder="Email:" required>
                </div>

                <div class="campo">
                    <input type="text" id="cpf" placeholder="CPF:" maxlength="14" required>
                </div>

                <div class="campo">
                    <input type="tel" id="telefone" placeholder="Telefone:" maxlength="15" required>
                </div>

                <div class="campo select-container">
                    <select id="funcao" required>
                        <option value="" selected disabled>Selecione sua função:</option>
                        <option value="seguranca">Segurança</option>
                        <option value="gestor">Gestor</option>
                    </select>
                    <span class="seta"></span>
                </div>

                <div class="campo">
                    <input type="password" id="senha" placeholder="Senha:" required>
                </div>

                <div class="campo">
                    <input type="password" id="confirmarSenha" placeholder="Confirmar senha:" required>
                </div>

                <button type="submit" class="btnCadastro">Fazer cadastro</button>

                <p class="login">
                    Já possui uma conta?
                    <a href="inicio.html">Faça Login</a>
                </p>

                <p id="mensagem"></p>
            </form>
        </section>
    </main>

    <script src="../renderer/scriptCadastroSeguranca.js"></script>
    <script src="../renderer/scriptMenuConfig.js"></script>
</body>

</html>
